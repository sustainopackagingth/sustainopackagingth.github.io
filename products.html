<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products | Sustaino</title><link rel="stylesheet" href="site.css"></head><body><nav><a class="brand" href="index.html">SUSTAINO</a><a href="why-sustaino.html">WHY SUSTAINO</a></nav><main class="wrap" id="product-type"><small>PRODUCT CATALOGUE</small><h1>Packaging for service.</h1><p>Supplier catalogue images used with permission.</p><div id="filters" class="filters"></div><section id="grid" class="grid"></section></main><script src="catalog-data.js"></script><script>let c=['All',...new Set(catalog.map(x=>x[2]))],preset=new URLSearchParams(location.search).get('category'),a=c.includes(preset)?preset:'All',F=document.querySelector('#filters'),G=document.querySelector('#grid');function d(){F.innerHTML=c.map(x=>`<button class="${x==a?'on':''}" onclick="a='${x}';d()">${x}</button>`).join('');G.innerHTML=catalog.filter(x=>a=='All'||x[2]==a).map(x=>`<article class="card"><div class="photo" style="background-image:url(${x[6]||"catalog-placeholder.png"}),url(catalog-placeholder.png)"></div><div class="body"><div class="cat">${x[2]}</div><h2>${x[1]}</h2><p class="spec">${x[3]}<br>${x[4]}<br>${x[5]}</p><div class="sku">SKU: ${x[0]}<br><a class="enquire" href="product.html?sku=${x[0]}">VIEW PRODUCT DETAILS</a></div></div></article>`).join('')}d()</script><script src="site-nav.js"></script></body></html>
