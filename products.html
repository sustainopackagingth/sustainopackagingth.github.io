<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products | Sustaino Packaging TH</title><link rel="stylesheet" href="site.css"><style>.catalogue-intro{padding:52px 0 28px}.catalogue-intro h1{margin:10px 0}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:28px 0 24px}.step{border-top:1px solid #aab69a;padding:12px 0;font:700 10px Arial,sans-serif;letter-spacing:.12em;color:#718247}.step b{display:block;color:#173c28;font:400 25px/1 Georgia,serif;letter-spacing:-.03em;margin-top:7px}.step.active{border-color:#173c28}.catalogue-note{max-width:660px;margin:0;color:#31523f}.card-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.card-actions .enquire{display:inline-flex}.add-enquiry{margin-top:0}@media(max-width:700px){.steps{grid-template-columns:1fr}.catalogue-intro{padding-top:30px}}#grid{opacity:1!important;transform:none!important;transition:none!important}.grid .card{opacity:1!important;transform:none!important;transition:none!important}</style></head><body><nav><a class="brand" href="index.html">SUSTAINO</a></nav><main class="wrap" id="product-type"><section class="catalogue-intro"><small>PRODUCT CATALOGUE</small><h1>Choose packaging for your service.</h1><p class="catalogue-note">Browse by product category, open a specification when needed, then add the formats you want to discuss. Your enquiry list stays visible at the bottom of the page.</p><div class="steps"><div class="step active">01<b>Choose a category</b></div><div class="step">02<b>Add products</b></div><div class="step">03<b>Send your enquiry</b></div></div></section><div id="filters" class="filters" aria-label="Product categories"></div><section id="grid" class="grid" aria-live="polite"></section></main><script src="catalog-data.js"></script><script>let c=['All',...new Set(catalog.map(x=>x[2]))],preset=new URLSearchParams(location.search).get('category'),a=c.includes(preset)?preset:'All',F=document.querySelector('#filters'),G=document.querySelector('#grid');function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function d(){F.innerHTML=c.map(x=>`<button class="${x==a?'on':''}" onclick="a='${x}';d()">${esc(x)}</button>`).join('');G.innerHTML=catalog.filter(x=>a=='All'||x[2]==a).map(x=>`<article class="card"><div class="photo" style="background-image:url(${x[6]||'catalog-placeholder.png'})"></div><div class="body"><div class="cat">${esc(x[2])}</div><h2>${esc(x[1])}</h2><p class="spec">${esc(x[3])}<br>${esc(x[4])}<br>${esc(x[5])}</p><div class="sku">SKU: ${esc(x[0])}</div><div class="card-actions"><button class="add-enquiry" type="button" data-enquiry-item="${esc(x[0])} — ${esc(x[1])}">ADD TO ENQUIRY +</button><a class="enquire" href="product.html?sku=${encodeURIComponent(x[0])}">VIEW SPECIFICATION</a></div></div></article>`).join('')}d()</script><script src="site-nav.js"></script></body></html>
